name: PawnHero
description: PawnHero is the Philippines' first online pawnshop, offering instant collateral-based cash
  loans against jewelry, gold, luxury designer bags, watches, gadgets, and Apple devices. Customers
  create a pawn ticket online, an in-house courier ("Pawntrooper") collects the item for appraisal, and
  approved funds are disbursed within minutes via bank transfer or e-wallet, with loan terms up to 180
  days and renewal options. The business is supervised by the Bangko Sentral ng Pilipinas (BSP). PawnHero
  operates as a consumer-facing web and mobile service and publishes no public developer API.
